<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b2a33;--mute:#6f6b78;--rose:#d9788f;--sage:#7fa593;--gold:#d8a657;--line:#eadfd6}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#f6d6dd,#dfeee6);padding:28px 20px 18px;text-align:center}
h1{margin:0;font-size:1.9rem;letter-spacing:.5px}header p{margin:6px 0 0;color:var(--mute);font-family:system-ui,sans-serif}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:12px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{font:600 .9rem system-ui;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
main{max-width:980px;margin:0 auto;padding:16px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{margin:.2em 0 .4em}h3{margin:.2em 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bar{height:12px;background:#efe7df;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));width:0;transition:width .4s}
.bar.sage>i{background:var(--sage)}.big{font:700 1.7rem system-ui}.mute{color:var(--mute);font:.85rem system-ui}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f3ece5;font-family:system-ui,sans-serif;font-size:.93rem}
.row:last-child{border:0}.row input{margin-top:4px;width:18px;height:18px;accent-color:var(--rose);flex:none}.row.done .t{text-decoration:line-through;color:var(--mute)}
.row .p{margin-left:auto;font-weight:600;white-space:nowrap}.tag{font-size:.72rem;background:#f3e9f0;border-radius:6px;padding:1px 6px;color:#7a4f66}
a{color:#b24a68}table{width:100%;border-collapse:collapse;font:.9rem system-ui}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.filters select{padding:6px;border-radius:8px;border:1px solid var(--line)}
.over{color:#b3261e}.ok{color:#2d7a4f}details summary{cursor:pointer;font-weight:600}ul{margin:.3em 0;padding-left:1.2em;font-family:system-ui,sans-serif;font-size:.93rem}
footer{text-align:center;color:var(--mute);font:.8rem system-ui;padding:24px}
@media print{nav{display:none}section{display:block!important}}
</style></head><body>

ose, no smoking, room-sharing for the first months.","Support the head, nappy changes, cord stump care (keep dry), sponge baths until it falls off.","Car seat: rear-facing, fitted professionally, never put baby in with bulky clothes.","Practice with a doll before the birth. Fever ≥38°C under 3 months = go to ER."]},{"n":6,"date":"Wed 25 Nov 2026","title":"Breastfeeding & feeding support","mins":45,"vids":[["Breastfeeding latch & positions (search)","https://www.youtube.com/results?search_query=breastfeeding+latch+positions+partner+support"],["La Leche League","https://llli.org/"],["Baby Sense (South Africa)","https://www.babysense.com/"]],"learn":["Your job: water, snacks, burping, nappies, night-time passing baby, guarding rest.","Skin-to-skin in the first hour improves latching; ask for a lactation consultant in hospital.","Hunger cues; newborns feed 8–12×/day; wet/dirty nappy counts show intake.","Know when to get help: pain, poor weight gain, jaundice, <6 wet nappies by day 5."]},{"n":7,"date":"Wed 2 Dec 2026","title":"Postpartum recovery & mental health","mins":50,"vids":[["Postpartum recovery for partners (search)","https://www.youtube.com/results?search_query=postpartum+recovery+what+partners+need+to+know"],["Postpartum Support International","https://www.postpartum.net/"],["SADAG mental health (SA): 0800 21 22 23","https://www.sadag.org/"]],"learn":["Sumi: bleeding (lochia) for 4–6 weeks, perineal/C-section wound care, rest, hydration, iron.","Baby blues (days 3–10) are common; postnatal depression/anxiety lasts longer or is severe. Watch for: persistent low mood, no bonding, panic, intrusive thoughts → call Dr Hassim/GP and SADAG 0800 21 22 23 / 0800 456 789.","Emergency signs: soaking a pad per hour, fever >38°C, severe headache, painful swollen leg, chest pain/breathlessness.","You: protect sleep in shifts, meals, visitor limits, check in daily on how Sumi is doing. Partners get postnatal depression too.","Attend the 6-week check; discuss contraception an assim delivery fee: elective C-section","R25,500",""],["Dr Hassim delivery fee: emergency C-section","R29,000",""],["Private room upgrade (per night)","Ask on tour","Budget a buffer of R2,000–R5,000/night until quoted (assumption)"],["Partner overnight stay","Ask on tour",""],["Anaesthetist / paediatrician","Not in OB fee","Covered by Zestlife up to 500% if registered hospital"],["Buffer for co-payments","~R5,000–R10,000 (assumption)","Hold in a separate account"]],"timeline":[["Mon 12 Oct 2026","20-week scan done: baby girl, all normal ✅"],["Wed 14 Oct 17:30","Tour maternity rooms (Calendar event set)"],["Sun 18–Fri 23 Oct","London trip (EK766 out 18 Oct; back Sat 24 Oct)"],["Wed 21 Oct →","Weekly childbirth-education blocks begin (8 weeks)"],["Tue 20 Oct 09:00","Review maternity costings + approvals"],["Thu 19 Nov 15:30","Dr Hassim visit: bring heart-focus question + fee quote + hospital choice"],["Fri 27 Nov","Black Friday: buy pram, car seat, cot if shortlisted"],["Fri 4 Dec","Week 28: Bankmed pre-authorisation deadline (aim 20 Nov)"],["Jan 2027","Optional 32–34 wk growth scan; CPR class; antenatal class; bags packed by 15 Jan"],["Fri 29 Jan 2027","36 weeks: pay Dr Hassim for R1,000 discount; car seat fitted"],["Sat 27 Feb 2027","Due date"]]};
